<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Error | Rehana Groups</title>

    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>

<body class="bg-slate-50 text-slate-800">

<div th:replace="~{fragments/navbar ::navbar}"></div>

<main class="flex min-h-[70vh] items-center justify-center px-6">

    <section class="w-full max-w-lg">

        <div class="rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-lg sm:p-10">

            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-red-100">
                <span class="text-2xl font-bold text-red-600">
                    !
                </span>
            </div>

            <p class="mt-6 text-sm font-semibold uppercase tracking-[0.25em] text-red-500">
                Something went wrong
            </p>

            <h1 class="mt-2 text-3xl font-bold text-slate-900">
                Error
            </h1>

            <p class="mt-4 leading-7 text-slate-500"
               th:text="${message}">
            </p>

            <a th:href="@{/home}"
               class="mt-8 inline-block rounded-lg bg-slate-900 px-6 py-3
                      font-semibold text-white shadow-md
                      transition hover:bg-slate-800 hover:-translate-y-0.5">
                Back to Home
            </a>

        </div>

    </section>

</main>

</body>
</html>
