<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Bookings | Rehana Groups</title>

    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>

<body class="bg-slate-50 text-slate-800">

<div th:replace="~{fragments/navbar ::navbar}"></div>

<main>

    <!-- Header -->
    <section class="bg-slate-900 text-white">
        <div class="mx-auto max-w-7xl px-6 py-14">

            <p class="text-sm font-semibold uppercase tracking-[0.3em] text-amber-400">
                Administration
            </p>

            <h1 class="mt-3 text-4xl font-bold sm:text-5xl">
                Manage Bookings
            </h1>

            <p class="mt-4 max-w-2xl text-slate-300">
                Review and manage customer reservations.
            </p>

        </div>
    </section>


    <!-- Bookings Table -->
    <section class="mx-auto max-w-7xl px-6 py-12">

        <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-lg">

            <div class="overflow-x-auto">

                <table class="w-full min-w-[1100px] text-left">

                    <thead class="bg-slate-900 text-sm text-white">

                    <tr>
                        <th class="px-6 py-4 font-semibold">Booking ID</th>
                        <th class="px-6 py-4 font-semibold">User</th>
                        <th class="px-6 py-4 font-semibold">Room</th>
                        <th class="px-6 py-4 font-semibold">Check In</th>
                        <th class="px-6 py-4 font-semibold">Check Out</th>
                        <th class="px-6 py-4 font-semibold">Guests</th>
                        <th class="px-6 py-4 font-semibold">Total Price</th>
                        <th class="px-6 py-4 font-semibold">Status</th>
                        <th class="px-6 py-4 text-center font-semibold">Actions</th>
                    </tr>

                    </thead>


                    <tbody class="divide-y divide-slate-100">

                    <tr th:each="booking : ${bookings}"
                        class="transition hover:bg-slate-50">

                        <td class="px-6 py-5 font-semibold text-slate-900"
                            th:text="${booking.bookingId}">
                        </td>

                        <td class="px-6 py-5 text-sm text-slate-600"
                            th:text="${booking.user.username}">
                        </td>

                        <td class="px-6 py-5 font-medium text-slate-900"
                            th:text="'Room ' + ${booking.room.roomNumber}">
                        </td>

                        <td class="px-6 py-5 text-sm text-slate-600"
                            th:text="${booking.checkIn}">
                        </td>

                        <td class="px-6 py-5 text-sm text-slate-600"
                            th:text="${booking.checkOut}">
                        </td>

                        <td class="px-6 py-5 text-sm text-slate-600"
                            th:text="${booking.guests}">
                        </td>

                        <td class="px-6 py-5 font-semibold text-slate-900"
                            th:text="'JOD ' + ${booking.totalPrice}">
                        </td>


                        <!-- Status -->
                        <td class="px-6 py-5">

                            <span th:if="${booking.status.name() == 'PENDING'}"
                                  class="inline-flex rounded-full bg-amber-100 px-3 py-1
                                         text-xs font-semibold text-amber-700">
                                Pending
                            </span>

                            <span th:if="${booking.status.name() == 'CONFIRMED'}"
                                  class="inline-flex rounded-full bg-green-100 px-3 py-1
                                         text-xs font-semibold text-green-700">
                                Confirmed
                            </span>

                            <span th:if="${booking.status.name() == 'CANCELLED'}"
                                  class="inline-flex rounded-full bg-red-100 px-3 py-1
                                         text-xs font-semibold text-red-700">
                                Cancelled
                            </span>

                            <span th:if="${booking.status.name() == 'COMPLETED'}"
                                  class="inline-flex rounded-full bg-slate-100 px-3 py-1
                                         text-xs font-semibold text-slate-600">
                                Completed
                            </span>

                        </td>


                        <!-- Actions -->
                        <td class="px-6 py-5">

                            <div class="flex flex-wrap justify-center gap-2">

                                <!-- Confirm -->
                                <form th:if="${booking.status.name() == 'PENDING'}"
                                      th:action="@{/admin/bookings/confirm/{id}(id=${booking.bookingId})}"
                                      method="post">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button type="submit"
                                            class="rounded-lg bg-green-600 px-3 py-2
                                                   text-xs font-semibold text-white
                                                   transition hover:bg-green-700">
                                        Confirm
                                    </button>

                                </form>


                                <!-- Cancel -->
                                <form th:if="${booking.status.name() == 'PENDING' or booking.status.name() == 'CONFIRMED'}"
                                      th:action="@{/admin/bookings/cancel/{id}(id=${booking.bookingId})}"
                                      method="post">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button type="submit"
                                            class="rounded-lg border border-red-200 px-3 py-2
                                                   text-xs font-semibold text-red-600
                                                   transition hover:bg-red-50">
                                        Cancel
                                    </button>

                                </form>


                                <!-- Complete -->
                                <form th:if="${booking.status.name() == 'CONFIRMED'}"
                                      th:action="@{/admin/bookings/complete/{id}(id=${booking.bookingId})}"
                                      method="post">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button type="submit"
                                            class="rounded-lg bg-slate-900 px-3 py-2
                                                   text-xs font-semibold text-white
                                                   transition hover:bg-slate-800">
                                        Complete
                                    </button>

                                </form>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- Back -->
        <div class="mt-8">

            <a th:href="@{/admin}"
               class="text-sm font-semibold text-slate-600
                      transition hover:text-amber-600">
                ← Back to Dashboard
            </a>

        </div>

    </section>

</main>

</body>
</html>
