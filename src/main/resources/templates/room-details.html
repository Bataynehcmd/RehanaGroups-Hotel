<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Room Details | Rehana Groups</title>

    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>

<body class="bg-slate-50 text-slate-800">

<div th:replace="~{fragments/navbar ::navbar}"></div>

<main>

    <!-- Header -->
    <section class="bg-slate-900 text-white">
        <div class="mx-auto max-w-7xl px-6 py-14 text-center">

            <p class="text-sm font-semibold uppercase tracking-[0.3em] text-amber-400">
                Room Details
            </p>

            <h1 class="mt-3 text-4xl font-bold sm:text-5xl"
                th:text="'Room ' + ${room.roomNumber}">
            </h1>

        </div>
    </section>


    <!-- Details Card -->
    <section class="mx-auto max-w-4xl px-6 py-16">

        <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-lg sm:p-10">

            <!-- Room Type & Price -->
            <div class="flex flex-col gap-5 border-b border-slate-200 pb-6 sm:flex-row sm:items-center sm:justify-between">

                <div>
                    <p class="text-xs font-semibold uppercase tracking-widest text-amber-600">
                        Room Type
                    </p>

                    <h2 class="mt-1 text-2xl font-bold text-slate-900"
                        th:text="${room.roomType}">
                    </h2>
                </div>

                <div class="rounded-xl bg-slate-100 px-5 py-3 text-center sm:text-right">

                    <p class="text-2xl font-bold text-slate-900"
                       th:text="'JOD ' + ${room.price}">
                    </p>

                    <p class="text-sm text-slate-500">
                        per night
                    </p>

                </div>

            </div>


            <!-- Information -->
            <div class="grid gap-6 border-b border-slate-200 py-6 sm:grid-cols-2">

                <div>
                    <p class="text-sm font-semibold text-slate-500">
                        Capacity
                    </p>

                    <p class="mt-1 text-lg font-semibold text-slate-900"
                       th:text="${room.capacity} + ' guests'">
                    </p>
                </div>

                <div>
                    <p class="text-sm font-semibold text-slate-500">
                        Availability
                    </p>

                    <p th:if="${room.active}"
                       class="mt-1 text-lg font-semibold text-green-600">
                        Available
                    </p>

                    <p th:unless="${room.active}"
                       class="mt-1 text-lg font-semibold text-red-600">
                        Currently Unavailable
                    </p>
                </div>

            </div>


            <!-- Description -->
            <div class="py-6">

                <p class="text-sm font-semibold text-slate-500">
                    Description
                </p>

                <p class="mt-2 leading-7 text-slate-600"
                   th:text="${room.description}">
                </p>

            </div>


            <!-- Actions -->
            <div class="flex flex-col gap-3 border-t border-slate-200 pt-6 sm:flex-row">

                <a th:if="${room.active}"
                   th:href="@{/rooms/{roomId}/book(roomId=${room.roomId})}"
                   class="flex-1 rounded-lg bg-slate-900 px-5 py-3
                          text-center font-semibold text-white
                          transition hover:bg-slate-800 hover:-translate-y-0.5">
                    Book This Room
                </a>

                <a th:href="@{/rooms}"
                   class="flex-1 rounded-lg border border-slate-300 px-5 py-3
                          text-center font-semibold text-slate-700
                          transition hover:border-slate-900 hover:bg-slate-50">
                    ← Back to Rooms
                </a>

            </div>

        </div>

    </section>

</main>

</body>
</html>
