<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Profile | Rehana Groups</title>

    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>

<body class="bg-slate-50 text-slate-800">

<div th:replace="~{fragments/navbar ::navbar}"></div>

<main>

    <!-- Header -->
    <section class="bg-slate-900 text-white">
        <div class="mx-auto max-w-7xl px-6 py-14 text-center">

            <p class="text-sm font-semibold uppercase tracking-[0.3em] text-amber-400">
                Account
            </p>

            <h1 class="mt-3 text-4xl font-bold sm:text-5xl">
                My Profile
            </h1>

            <p class="mx-auto mt-4 max-w-xl text-slate-300">
                View and manage your account information.
            </p>

        </div>
    </section>


    <!-- Profile Card -->
    <section class="mx-auto max-w-2xl px-6 py-16">

        <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-lg sm:p-10">

            <!-- Profile Header -->
            <div class="mb-8 flex items-center gap-4 border-b border-slate-200 pb-6">

                <div class="flex h-14 w-14 items-center justify-center rounded-full bg-slate-900">
                    <span class="text-xl font-bold text-amber-400">
                        <span th:text="${user.firstName.substring(0,1)}"></span>
                    </span>
                </div>

                <div>
                    <h2 class="text-xl font-bold text-slate-900"
                        th:text="${user.firstName} + ' ' + ${user.lastName}">
                    </h2>

                    <p class="text-sm text-slate-500"
                       th:text="'@' + ${user.username}">
                    </p>
                </div>

            </div>


            <!-- Information -->
            <div class="space-y-5">

                <div class="rounded-xl bg-slate-50 px-5 py-4">
                    <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">
                        First Name
                    </p>

                    <p class="mt-1 font-semibold text-slate-900"
                       th:text="${user.firstName}">
                    </p>
                </div>


                <div class="rounded-xl bg-slate-50 px-5 py-4">
                    <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">
                        Last Name
                    </p>

                    <p class="mt-1 font-semibold text-slate-900"
                       th:text="${user.lastName}">
                    </p>
                </div>


                <div class="rounded-xl bg-slate-50 px-5 py-4">
                    <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">
                        Username
                    </p>

                    <p class="mt-1 font-semibold text-slate-900"
                       th:text="${user.username}">
                    </p>
                </div>


                <div class="rounded-xl bg-slate-50 px-5 py-4">
                    <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">
                        Email
                    </p>

                    <p class="mt-1 font-semibold text-slate-900"
                       th:text="${user.email}">
                    </p>
                </div>

            </div>


            <!-- Edit -->
            <div class="mt-8 border-t border-slate-200 pt-6">

                <a th:href="@{/profile/edit}"
                   class="block w-full rounded-lg bg-slate-900 px-5 py-3
                          text-center font-semibold text-white
                          transition hover:bg-slate-800 hover:-translate-y-0.5">
                    Edit Profile
                </a>

            </div>

        </div>

    </section>

</main>

</body>
</html>
