<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Profile | Rehana Groups</title>

    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>

<body class="bg-slate-50 text-slate-800">

<div th:replace="~{fragments/navbar ::navbar}"></div>

<main>

    <!-- Header -->
    <section class="bg-slate-900 text-white">
        <div class="mx-auto max-w-7xl px-6 py-14 text-center">

            <p class="text-sm font-semibold uppercase tracking-[0.3em] text-amber-400">
                Account
            </p>

            <h1 class="mt-3 text-4xl font-bold sm:text-5xl">
                Edit Profile
            </h1>

            <p class="mx-auto mt-4 max-w-xl text-slate-300">
                Update your personal information.
            </p>

        </div>
    </section>


    <!-- Edit Form -->
    <section class="mx-auto max-w-2xl px-6 py-16">

        <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-lg sm:p-10">

            <div class="mb-8">
                <h2 class="text-2xl font-bold text-slate-900">
                    Personal Information
                </h2>

                <p class="mt-1 text-sm text-slate-500">
                    Make changes to your profile details below.
                </p>
            </div>


            <form th:action="@{/profile/edit}"
                  th:object="${editDTO}"
                  method="post"
                  class="space-y-6">


                <!-- First Name -->
                <div>
                    <label for="firstName"
                           class="mb-2 block text-sm font-semibold text-slate-700">
                        First Name
                    </label>

                    <input id="firstName"
                           type="text"
                           th:field="*{firstName}"
                           required
                           class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3
                                  text-slate-800 outline-none transition
                                  focus:border-amber-500 focus:ring-2 focus:ring-amber-200">
                </div>


                <!-- Last Name -->
                <div>
                    <label for="lastName"
                           class="mb-2 block text-sm font-semibold text-slate-700">
                        Last Name
                    </label>

                    <input id="lastName"
                           type="text"
                           th:field="*{lastName}"
                           required
                           class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3
                                  text-slate-800 outline-none transition
                                  focus:border-amber-500 focus:ring-2 focus:ring-amber-200">
                </div>


                <!-- Email -->
                <div>
                    <label for="email"
                           class="mb-2 block text-sm font-semibold text-slate-700">
                        Email
                    </label>

                    <input id="email"
                           type="email"
                           th:field="*{email}"
                           required
                           class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3
                                  text-slate-800 outline-none transition
                                  focus:border-amber-500 focus:ring-2 focus:ring-amber-200">
                </div>


                <!-- CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">


                <!-- Submit -->
                <button type="submit"
                        class="w-full rounded-lg bg-slate-900 px-6 py-3
                               font-semibold text-white shadow-md
                               transition hover:bg-slate-800 hover:-translate-y-0.5">
                    Update Profile
                </button>

            </form>


            <!-- Back -->
            <div class="mt-6 border-t border-slate-200 pt-6 text-center">

                <a th:href="@{/profile}"
                   class="text-sm font-semibold text-slate-600 transition hover:text-amber-600">
                    ← Back to Profile
                </a>

            </div>

        </div>

    </section>

</main>

</body>
</html>
