<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login | Rehana Groups</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-50 text-slate-800">

<div th:replace="~{fragments/navbar ::navbar}"></div>

<main class="flex min-h-[calc(100vh-73px)] items-center justify-center px-6 py-16">

    <section class="w-full max-w-md">

        <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-lg sm:p-10">

            <div class="mb-8 text-center">

                <p class="text-sm font-semibold uppercase tracking-[0.3em] text-amber-500">
                    Welcome Back
                </p>

                <h1 class="mt-2 text-3xl font-bold text-slate-900">
                    Login
                </h1>

                <p class="mt-2 text-sm text-slate-500">
                    Sign in to manage your reservations.
                </p>

            </div>


            <form action="/login"
                  method="post"
                  class="space-y-6">

                <!-- CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">


                <!-- Username -->
                <div>
                    <label for="username"
                           class="mb-2 block text-sm font-semibold text-slate-700">
                        Username
                    </label>

                    <input id="username"
                           name="username"
                           type="text"
                           required
                           class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3
                                  text-slate-800 outline-none transition
                                  focus:border-amber-500 focus:ring-2 focus:ring-amber-200">
                </div>


                <!-- Password -->
                <div>
                    <label for="password"
                           class="mb-2 block text-sm font-semibold text-slate-700">
                        Password
                    </label>

                    <input id="password"
                           name="password"
                           type="password"
                           required
                           class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3
                                  text-slate-800 outline-none transition
                                  focus:border-amber-500 focus:ring-2 focus:ring-amber-200">
                </div>


                <!-- Login -->
                <button type="submit"
                        class="w-full rounded-lg bg-slate-900 px-6 py-3
                               font-semibold text-white shadow-md
                               transition hover:bg-slate-800 hover:-translate-y-0.5">
                    Login
                </button>

            </form>


            <div class="mt-6 border-t border-slate-200 pt-6 text-center">

                <p class="text-sm text-slate-500">
                    Don't have an account?
                    <a th:href="@{/register}"
                       class="font-semibold text-amber-600 transition hover:text-amber-500">
                        Create one
                    </a>
                </p>

            </div>

        </div>

    </section>

</main>

</body>
</html>
