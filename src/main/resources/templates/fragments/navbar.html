<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Rehana Groups</title>
</head>
<body>

<nav th:fragment="navbar"
     class="border-b border-slate-800 bg-slate-950 text-white shadow-lg">

    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

        <!-- Logo -->
        <a th:href="@{/home}"
           class="text-2xl font-bold tracking-wide text-white transition hover:text-amber-400">
            Rehana <span class="text-amber-400">Groups</span>
        </a>


        <!-- Navigation -->
        <div class="flex items-center gap-2">

            <a th:href="@{/home}"
               class="rounded-lg px-4 py-2 text-sm font-medium text-slate-300
                      transition hover:bg-slate-800 hover:text-white">
                Home
            </a>

            <a th:href="@{/rooms}"
               class="rounded-lg px-4 py-2 text-sm font-medium text-slate-300
                      transition hover:bg-slate-800 hover:text-white">
                Rooms
            </a>

            <a th:href="@{/rooms/search}"
               class="rounded-lg px-4 py-2 text-sm font-medium text-slate-300
                      transition hover:bg-slate-800 hover:text-white">
                Search
            </a>


            <!-- Guest -->
            <a sec:authorize="isAnonymous()"
               th:href="@{/register}"
               class="rounded-lg px-4 py-2 text-sm font-medium text-slate-300
                      transition hover:bg-slate-800 hover:text-white">
                Register
            </a>

            <a sec:authorize="isAnonymous()"
               th:href="@{/login}"
               class="rounded-lg bg-amber-500 px-5 py-2 text-sm font-semibold text-slate-950
                      transition hover:bg-amber-400">
                Login
            </a>


            <!-- User -->
            <a sec:authorize="isAuthenticated()"
               th:href="@{/profile}"
               class="rounded-lg px-4 py-2 text-sm font-medium text-slate-300
                      transition hover:bg-slate-800 hover:text-white">
                Profile
            </a>

            <a sec:authorize="isAuthenticated()"
               th:href="@{/my-bookings}"
               class="rounded-lg px-4 py-2 text-sm font-medium text-slate-300
                      transition hover:bg-slate-800 hover:text-white">
                My Bookings
            </a>


            <!-- Admin -->
            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/admin}"
               class="rounded-lg px-4 py-2 text-sm font-semibold text-amber-400
                      transition hover:bg-slate-800 hover:text-amber-300">
                Admin
            </a>


            <!-- Logout -->
            <form sec:authorize="isAuthenticated()"
                  th:action="@{/logout}"
                  method="post"
                  class="ml-2">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit"
                        class="rounded-lg border border-slate-700 px-4 py-2
                               text-sm font-medium text-slate-300
                               transition hover:border-red-400 hover:text-red-400">
                    Logout
                </button>

            </form>

        </div>

    </div>

</nav>
</body>
</html>
