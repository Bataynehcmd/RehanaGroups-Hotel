<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Rooms | Rehana Groups</title>

    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>

<body class="bg-slate-50 text-slate-800">

<div th:replace="~{fragments/navbar ::navbar}"></div>

<main>

    <!-- Header -->
    <section class="bg-slate-900 text-white">
        <div class="mx-auto max-w-7xl px-6 py-14">

            <p class="text-sm font-semibold uppercase tracking-[0.3em] text-amber-400">
                Room Management
            </p>

            <h1 class="mt-3 text-4xl font-bold sm:text-5xl">
                Manage Rooms
            </h1>

            <p class="mt-4 max-w-2xl text-slate-300">
                Add, edit and manage the availability of hotel rooms.
            </p>

        </div>
    </section>


    <!-- Rooms -->
    <section class="mx-auto max-w-7xl px-6 py-12">

        <!-- Add Room -->
        <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">

            <div>
                <h2 class="text-2xl font-bold text-slate-900">
                    Room Inventory
                </h2>

                <p class="mt-1 text-sm text-slate-500">
                    Manage your hotel rooms and their availability.
                </p>
            </div>

            <a th:href="@{/admin/rooms/add}"
               class="inline-block rounded-lg bg-slate-900 px-5 py-3
                      text-center text-sm font-semibold text-white shadow-md
                      transition hover:bg-slate-800 hover:-translate-y-0.5">
                + Add Room
            </a>

        </div>


        <!-- Table -->
        <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-lg">

            <div class="overflow-x-auto">

                <table class="w-full min-w-[800px] text-left">

                    <thead class="bg-slate-900 text-sm text-white">

                    <tr>
                        <th class="px-6 py-4 font-semibold">Room Number</th>
                        <th class="px-6 py-4 font-semibold">Type</th>
                        <th class="px-6 py-4 font-semibold">Price</th>
                        <th class="px-6 py-4 font-semibold">Capacity</th>
                        <th class="px-6 py-4 font-semibold">Status</th>
                        <th class="px-6 py-4 text-center font-semibold">Actions</th>
                    </tr>

                    </thead>


                    <tbody class="divide-y divide-slate-100">

                    <tr th:each="room : ${rooms}"
                        class="transition hover:bg-slate-50">

                        <!-- Room Number -->
                        <td class="px-6 py-5 font-semibold text-slate-900"
                            th:text="'Room ' + ${room.roomNumber}">
                        </td>


                        <!-- Type -->
                        <td class="px-6 py-5">

                            <span class="text-sm font-medium text-slate-700"
                                  th:text="${room.roomType}">
                            </span>

                        </td>


                        <!-- Price -->
                        <td class="px-6 py-5 font-semibold text-slate-900"
                            th:text="'JOD ' + ${room.price}">
                        </td>


                        <!-- Capacity -->
                        <td class="px-6 py-5 text-sm text-slate-600"
                            th:text="${room.capacity} + ' guests'">
                        </td>


                        <!-- Status -->
                        <td class="px-6 py-5">

                            <span th:if="${room.active}"
                                  class="inline-flex rounded-full bg-green-100 px-3 py-1
                                         text-xs font-semibold text-green-700">
                                Active
                            </span>

                            <span th:unless="${room.active}"
                                  class="inline-flex rounded-full bg-red-100 px-3 py-1
                                         text-xs font-semibold text-red-700">
                                Inactive
                            </span>

                        </td>


                        <!-- Actions -->
                        <td class="px-6 py-5">

                            <div class="flex flex-wrap justify-center gap-2">

                                <!-- Edit -->
                                <a th:href="@{/admin/rooms/edit/{id}(id=${room.roomId})}"
                                   class="rounded-lg border border-slate-300 px-4 py-2
                                          text-sm font-semibold text-slate-700
                                          transition hover:border-slate-900
                                          hover:bg-slate-50">
                                    Edit
                                </a>


                                <!-- Toggle -->
                                <form th:action="@{/admin/rooms/toggle/{id}(id=${room.roomId})}"
                                      method="post">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button type="submit"
                                            th:text="${room.active ? 'Deactivate' : 'Activate'}"
                                            th:class="${room.active}
                                                ? 'rounded-lg border border-red-200 px-4 py-2 text-sm font-semibold text-red-600 transition hover:bg-red-50'
                                                : 'rounded-lg bg-green-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-green-700'">
                                    </button>

                                </form>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </section>

</main>

</body>
</html>
