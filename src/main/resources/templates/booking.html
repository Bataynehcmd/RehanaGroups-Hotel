<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Book Room | Rehana Groups</title>

    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>

<body class="bg-slate-50 text-slate-800">

<div th:replace="~{fragments/navbar ::navbar}"></div>

<main>

    <!-- Header -->
    <section class="bg-slate-900 text-white">
        <div class="mx-auto max-w-7xl px-6 py-14 text-center">

            <p class="text-sm font-semibold uppercase tracking-[0.3em] text-amber-400">
                Reservation
            </p>

            <h1 class="mt-3 text-4xl font-bold sm:text-5xl">
                Book Your Room
            </h1>

            <p class="mx-auto mt-4 max-w-xl text-slate-300">
                Choose your dates and number of guests to complete your reservation.
            </p>

        </div>
    </section>


    <!-- Booking Form -->
    <section class="mx-auto max-w-2xl px-6 py-16">

        <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-lg sm:p-10">

            <div class="mb-8">
                <h2 class="text-2xl font-bold text-slate-900">
                    Reservation Details
                </h2>

                <p class="mt-1 text-sm text-slate-500">
                    Please provide your stay information.
                </p>
            </div>


            <form th:action="@{/rooms/{roomId}/book(roomId=${bookingDTO.roomId})}"
                  th:object="${bookingDTO}"
                  method="post"
                  class="space-y-6">

                <input type="hidden"
                       th:field="*{roomId}">


                <!-- Check In -->
                <div>
                    <label for="checkIn"
                           class="mb-2 block text-sm font-semibold text-slate-700">
                        Check In
                    </label>

                    <input id="checkIn"
                           type="date"
                           th:field="*{checkIn}"
                           required
                           class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3
                                  text-slate-800 outline-none transition
                                  focus:border-amber-500 focus:ring-2 focus:ring-amber-200">
                </div>


                <!-- Check Out -->
                <div>
                    <label for="checkOut"
                           class="mb-2 block text-sm font-semibold text-slate-700">
                        Check Out
                    </label>

                    <input id="checkOut"
                           type="date"
                           th:field="*{checkOut}"
                           required
                           class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3
                                  text-slate-800 outline-none transition
                                  focus:border-amber-500 focus:ring-2 focus:ring-amber-200">
                </div>


                <!-- Guests -->
                <div>
                    <label for="guests"
                           class="mb-2 block text-sm font-semibold text-slate-700">
                        Guests
                    </label>

                    <input id="guests"
                           type="number"
                           th:field="*{guests}"
                           min="1"
                           required
                           class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3
                                  text-slate-800 outline-none transition
                                  focus:border-amber-500 focus:ring-2 focus:ring-amber-200">
                </div>


                <!-- CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">


                <!-- Submit -->
                <button type="submit"
                        class="w-full rounded-lg bg-slate-900 px-6 py-3
                               font-semibold text-white shadow-md
                               transition hover:bg-slate-800 hover:-translate-y-0.5">
                    Confirm Booking
                </button>

            </form>


            <!-- Back -->
            <div class="mt-6 border-t border-slate-200 pt-6 text-center">

                <a th:href="@{/rooms}"
                   class="text-sm font-semibold text-slate-600 transition hover:text-amber-600">
                    ← Back to Rooms
                </a>

            </div>

        </div>

    </section>

</main>

</body>
</html>
